<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Badge -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#badgeGrad)" filter="url(#badgeShadow)" stroke="#FDE68A" stroke-width="2.5" />

  <!-- Asphalt Road Disc -->
  <circle cx="60" cy="60" r="38" fill="url(#roadGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Road Stripe (broken center marking) -->
  <line x1="60" y1="26" x2="60" y2="34" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4"/>
  <line x1="60" y1="86" x2="60" y2="94" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4"/>

  <!-- Pothole Irregular Crater Shape -->
  <path d="M42 54 C40 46, 52 42, 62 44 C72 45, 80 50, 78 58 C77 66, 68 74, 58 75 C48 76, 44 68, 42 54 Z" fill="#080C14" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Depth Shadow in Crater -->
  <path d="M46 56 C45 50, 54 47, 63 48 C70 49, 74 54, 72 60 C68 64, 58 66, 50 64 Z" fill="#020617"/>

  <!-- Road Asphalt Cracks / Fractures branching out -->
  <path d="M42 52 L32 46 L26 48" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78 56 L88 52 L94 56" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 75 L62 82 L58 86" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 43 L48 36" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
</svg>
