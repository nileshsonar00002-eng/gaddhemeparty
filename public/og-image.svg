  </text>

  <!-- Footer Disclaimer -->
  <rect x="0" y="570" width="1200" height="60" fill="#030712"/>
  <text x="600" y="608" font-family="'Noto Sans Devanagari', sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle">
    नागरिक पहल • कोई राजनीतिक दल नहीं • Citizen Initiative, Not a Political Party
  </text>
</svg>
