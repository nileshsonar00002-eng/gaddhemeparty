  <!-- Footer Disclaimer -->
  <rect x="0" y="570" width="1200" height="60" fill="#240C08"/>
  <text x="600" y="608" font-family="'Khand', sans-serif" font-size="18" fill="#DDD0C2" text-anchor="middle">
    नागरिक पहल • कोई राजनीतिक दल नहीं • 100% Free Civic Tech
