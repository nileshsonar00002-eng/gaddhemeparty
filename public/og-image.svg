<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#521F17" />
      <stop offset="100%" stop-color="#3A1712" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2B705" />
      <stop offset="50%" stop-color="#F07C1A" />
      <stop offset="100%" stop-color="#D93025" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#F9F2E8" stroke-width="1" opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Logo Badge Left -->
  <g transform="translate(100, 165) scale(2.5)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#brandGrad)" stroke="#FDF8F0" stroke-width="2" />
    <circle cx="50" cy="50" r="36" fill="#3A1712" stroke="#6B5A52" stroke-width="2"/>
    <path d="M35 45 C33 38, 43 35, 52 36 C60 37, 66 41, 65 48 C64 55, 56 61, 48 62 C40 63, 37 56, 35 45 Z" fill="#1A0805" stroke="#F2B705" stroke-width="2"/>
    <path d="M35 44 L26 39" stroke="#D93025" stroke-width="2" stroke-linecap="round"/>
    <path d="M65 47 L74 44" stroke="#D93025" stroke-width="2" stroke-linecap="round"/>
    <path d="M50 62 L52 70" stroke="#D93025" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text Header -->
  <text x="400" y="270" font-family="'Khand', 'Average Sans', sans-serif" font-weight="800" font-size="76" fill="#F9F2E8" letter-spacing="-1">
