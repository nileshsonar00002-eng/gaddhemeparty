  </text>
  <text x="400" y="395" font-family="'Khand', sans-serif" font-weight="600" font-size="34" fill="#F1E6D8">
    "जहाँ गड्ढा, वहाँ पार्टी"
  </text>
  <text x="400" y="460" font-family="'Inter', sans-serif" font-weight="500" font-size="22" fill="#DDD0C2">
