  </text>
  <text x="400" y="395" font-family="'Baloo 2', sans-serif" font-weight="600" font-size="36" fill="#94A3B8">
    "मेरा खड्डा, मेरी शान"
  </text>
  <text x="400" y="460" font-family="'Poppins', sans-serif" font-weight="500" font-size="22" fill="#64748B">
