<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="mascotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="100" cy="100" r="86" fill="#182028" stroke="#232B36" stroke-width="3" filter="url(#mascotShadow)"/>
  
  <!-- Asphalt Road Strip -->
  <path d="M26 138 Q100 126 174 138 L174 168 Q100 174 26 168 Z" fill="#0B0F14" stroke="#232B36" stroke-width="1.5" />
  
  <!-- Dashed Amber Markings -->
  <path d="M46 153 Q70 149 90 151" stroke="#F5B301" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5" />
  <path d="M110 151 Q130 149 154 153" stroke="#F5B301" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5" />

  <!-- Pothole Crater in Road -->
  <ellipse cx="100" cy="150" rx="26" ry="10" fill="#05080C" stroke="#F5B301" stroke-width="2" />
  <ellipse cx="100" cy="151" rx="18" ry="6" fill="#000000" />
  <path d="M80 146 L72 142 M120 146 L128 142 M100 158 L100 165" stroke="#E5484D" stroke-width="1.8" stroke-linecap="round" />

  <!-- Cute Bouncing Vehicle -->
  <g transform="translate(0, -6) rotate(-7 100 95)">
    <!-- Vehicle Body -->
    <rect x="70" y="62" width="60" height="42" rx="10" fill="#F5B301" stroke="#1A1300" stroke-width="3" />
    <!-- Roof -->
    <path d="M66 66 C66 54, 76 50, 100 50 C124 50, 134 54, 134 66 Z" fill="#0F172A" stroke="#1A1300" stroke-width="2.5" />
    
    <!-- Windshield -->
    <path d="M74 66 L94 66 L94 84 L74 84 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="2" />
    <path d="M99 66 L124 66 L124 84 L99 84 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="2" />
    
    <!-- Big Friendly Eyes -->
    <circle cx="82" cy="74" r="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <circle cx="84" cy="74" r="2.5" fill="#0F172A" />
    <circle cx="114" cy="74" r="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <circle cx="116" cy="74" r="2.5" fill="#0F172A" />

    <!-- Smile -->
    <path d="M86 94 Q100 102 114 94" stroke="#1A1300" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Headlights -->
    <circle cx="71" cy="88" r="4" fill="#FFFBEB" stroke="#1A1300" stroke-width="2" />
    <circle cx="129" cy="88" r="4" fill="#FFFBEB" stroke="#1A1300" stroke-width="2" />

    <!-- Wheels -->
    <circle cx="80" cy="110" r="10" fill="#1E293B" stroke="#0F172A" stroke-width="3" />
    <circle cx="80" cy="110" r="4" fill="#94A3B8" />
    <circle cx="120" cy="110" r="10" fill="#1E293B" stroke="#0F172A" stroke-width="3" />
    <circle cx="120" cy="110" r="4" fill="#94A3B8" />
  </g>

  <!-- Traffic Cone -->
  <polygon points="46,128 54,104 58,104 66,128" fill="#F5B301" stroke="#1A1300" stroke-width="2" />
  <polygon points="50,118 53,110 59,110 62,118" fill="#FFFFFF" />
  <rect x="42" y="127" width="28" height="3.5" rx="1.75" fill="#1A1300" />

  <!-- Party Confetti Sparkles -->
  <polygon points="152,76 155,82 161,82 156,86 158,92 152,88 146,92 148,86 143,82 149,82" fill="#F5B301" />
  <polygon points="38,78 40,82 45,82 41,85 43,89 38,86 33,89 35,85 31,82 36,82" fill="#E5484D" />
  <path d="M140 52 Q150 42 162 46" fill="none" stroke="#30A46C" stroke-width="2" stroke-linecap="round" />
</svg>